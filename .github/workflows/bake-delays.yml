name: bake-delays

# 加密试点（分支 enc-pilot）：仓库里只有密文（encrypted/**.enc + encryption/manifest.tsv），
# 明文只在 runner 的工作区短暂存在，跑完立即删除。
# 口令只来自 Secrets.CODE_KEY，仓库任何位置都不出现。
#
# 本文件只保留调度、解密、调入口、提交、部署，不含业务逻辑：
# 抓取与解析实现在 encrypted/ 下的密文里，入口 run.sh 同样是密文。
#
# The whole pipeline in one workflow:
#   - every run: dokorail live feeds (+ JR own-source feeds) -> data/delays.json
#     (only the timetable bundles of lines with delayed trains are fetched)
#   - Sundays / when missing: refresh the slow-moving caches - dokorail
#     geometry catalog (data/lines.json) and jr.suki.ing's tmaps.json +
#     lines_map.json snapshots (data/suki/)
#
# jr.suki.ing reads data/delays.json via Cloudflare Workers Static Assets
# (jr-delay.suki.ing, pure static, zero-cost). Its by_suki_key table tags the
# site's own trains with zero join logic. Board carries generated_at so the
# UI can show its age; GitHub cron jitters, so treat this as a refreshed
# snapshot, not a realtime stream.
#
# 日本限定源的出口: あおなみ線/ハピラインNAVI 只接受日本 IP, api.tokyoglance.com
# 直接 403 runner, 所以它们的 AONAMI_BASE/HAPILINE_BASE/TOKYOGLANCE_BASE
# 指向独立的 suki-jp-relay Worker

on:
  schedule:
    # 运行窗口: 东京时间 05:00 - 次日 02:00 (JST = UTC+9)
    - cron: "*/10 20-23 * * *"
    - cron: "*/10 0-16 * * *"
    - cron: "0 17 * * *"    # 最后一班: JST 02:00 整
  workflow_dispatch:

permissions:
  contents: write
  # lets baker.common.jp_relay_token mint the suki-jp-relay bearer
  id-token: write

concurrency:
  group: bake-delays
  cancel-in-progress: true

jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ODPT_KEY: ${{ secrets.ODPT_KEY }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      DOKORAIL_BASE: "https://dokorail-proxy.vercel.app"
      RELAY_KEY: ${{ secrets.RELAY_KEY }}
      AONAMI_BASE: "https://suki-jp-relay-7c41e9.lmc26817.workers.dev/jp/aonami"
      HAPILINE_BASE: "https://suki-jp-relay-7c41e9.lmc26817.workers.dev/jp/hapi"
      TOKYOGLANCE_BASE: "https://suki-jp-relay-7c41e9.lmc26817.workers.dev/jp/tg"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Decrypt sources（明文只存在于 runner，umask 077）
        env:
          # 口令仅经 runner 内存注入；不写文件、不进 argv、不打印
          OOEP_PASSPHRASE: ${{ secrets.CODE_KEY }}
        run: |
          set +x
          umask 077
          python3 encryption/decrypt.py decrypt \
            --enc encrypted \
            --manifest encryption/manifest.tsv \
            --out .
        # 解密工具自带校验：密文 sha256、GCM tag、明文 HMAC 任一不符立即非 0 退出；
        # 且拒绝覆盖已存在文件（仓库里若误留同名明文，这里直接 fail）。

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      # Meitetsu trainlocation HTML parser uses BeautifulSoup; all other
      # operators stay stdlib-only.
      - name: Install Python deps
        run: pip install beautifulsoup4

      - name: Run scrapers（入口清单同样是密文）
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set +x
          bash run.sh

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22

      - name: Commit if changed
        run: |
          git config user.name "baker[bot]"
          git config user.email "baker@users.noreply.github.com"
          git add data/delays.json data/sukijr.json data/lines.json data/suki
          if git diff --cached --quiet; then
            echo "board unchanged"
          else
            git commit -m "delays $(date -u +'%Y-%m-%dT%H:%MZ') $(python -c "import json;print(json.load(open('data/delays.json'))['delayed_count'])") late"
            # concurrent scheduled runs race on main - retry the push
            for i in 1 2 3 4 5; do
              git pull --no-rebase -X theirs origin main && git push && break
              echo "push retry $i"; sleep 10
            done
          fi

      # 把 jr-comfortable 的 comfort.json 镜像到自家域名（主站第一消费源）。
      - name: Mirror comfort.json onto jr-delay
        if: ${{ env.CF_API_TOKEN != '' }}
        run: python3 scripts/mirror_comfort.py

      - name: Deploy delay JSON to Cloudflare (jr-delay)
        if: ${{ env.CF_API_TOKEN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c75ed9a498500d7c232d9d59a353341d
        run: |
          set +x
          python3 scripts/prepare_delay_assets.py
          npx wrangler@4 deploy --config static-worker/wrangler.toml 2>&1 | tail -12

      # 仅试点用：把本次产物 data/ 上传成 artifact，便于与"改造前"逐字节比对。
      # 只上传数据目录，绝不上传仓库根、也绝不包含解密出来的源码。
      - name: Upload data snapshot（试点验收用）
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: encpilot-data
          if-no-files-found: warn
          path: |
            data/delays.json
            data/sukijr.json
            data/lines.json
            data/suki/**

      - name: Remove plaintext & assert clean tree（无论成败都执行）
        if: always()
        run: |
          set +x
          python3 encryption/decrypt.py clean \
            --manifest encryption/manifest.tsv \
            --out .
          git status --porcelain
          test -z "$(git status --porcelain)"

# 说明：
# 1. 不挂带 required reviewers 的 environment，保证 schedule 无人值守。
# 2. 不增加 pull_request / pull_request_target 触发器（外部 PR 是 secret 滥用的经典入口）。
# 3. 不开 ACTIONS_STEP_DEBUG，任何步骤都不 bash -x、不 cat 解密出的文件。
# 4. 第三方 action 全部按 commit SHA 钉死。
